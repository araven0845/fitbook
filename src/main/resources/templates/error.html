<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error - FitBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container"><a class="navbar-brand" href="/">FitBook</a></div>
</nav>
<div class="container">
    <h1 class="display-5"><span th:text="${status}">500</span> <span class="text-muted fs-4" th:text="${reason}">Error</span></h1>
    <p class="lead" th:text="${message}">Something went wrong.</p>
    <a class="btn btn-primary" href="/">Back to home</a>
    <a class="btn btn-outline-secondary" href="javascript:history.back()">Go back</a>
</div>
</body>
</html>
