<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bookings with me - FitBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container">
    <h1 class="h3 mb-3">Bookings with me</h1>
    <div class="text-muted" th:if="${appointments.empty}">Nobody has booked with you yet.</div>
    <table class="table table-striped align-middle" th:unless="${appointments.empty}">
        <thead><tr><th>When</th><th>Service</th><th>Customer</th><th>Status</th></tr></thead>
        <tbody>
        <tr th:each="a : ${appointments}">
            <td><span th:text="${a.startTime}">start</span> &ndash; <span th:text="${#strings.substring(a.endTime, 11)}">end</span></td>
            <td th:text="${a.serviceName}">Service</td>
            <td th:text="${a.customerName}">Customer</td>
            <td><span class="badge"
                      th:classappend="${a.status == 'BOOKED'} ? 'text-bg-success' : (${a.status == 'COMPLETED'} ? 'text-bg-secondary' : 'text-bg-warning')"
                      th:text="${a.status}">BOOKED</span></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
