<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Available slots - FitBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container">
    <h1 class="h3 mb-3">Available slots</h1>

    <form class="row g-2 mb-4" method="get" th:action="@{/browse}">
        <div class="col-md-3">
            <select class="form-select" name="providerId">
                <option value="">All trainers</option>
                <option th:each="p : ${providers}" th:value="${p.id}" th:text="${p.fullName}"
                        th:selected="${providerId != null and providerId == p.id}">Trainer</option>
            </select>
        </div>
        <div class="col-md-3">
            <select class="form-select" name="serviceId">
                <option value="">All services</option>
                <option th:each="s : ${services}" th:value="${s.id}" th:text="${s.name}"
                        th:selected="${serviceId != null and serviceId == s.id}">Service</option>
            </select>
        </div>
        <div class="col-md-3">
            <input class="form-control" type="date" name="date" th:value="${date}">
        </div>
        <div class="col-md-3">
            <button class="btn btn-primary" type="submit">Filter</button>
            <a class="btn btn-outline-secondary" th:href="@{/browse}">Reset</a>
        </div>
    </form>

    <div class="alert alert-info" th:if="${result.items.empty}">No open slots match these filters.</div>

    <table class="table table-striped align-middle" th:unless="${result.items.empty}">
        <thead>
        <tr><th>When</th><th>Service</th><th>Trainer</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="s : ${result.items}">
            <td><span th:text="${s.startTime}">2026-01-01 09:00</span> &ndash; <span th:text="${#strings.substring(s.endTime, 11)}">10:00</span></td>
            <td th:text="${s.serviceName}">Service</td>
            <td th:text="${s.providerName}">Trainer</td>
            <td class="text-end">
                <a th:if="${currentUser != null and currentUser.role.name() == 'CUSTOMER'}"
                   class="btn btn-sm btn-primary" th:href="@{/book(slotId=${s.id})}">Book</a>
                <a th:if="${currentUser == null}" class="btn btn-sm btn-outline-secondary" th:href="@{/login}">Log in to book</a>
            </td>
        </tr>
        </tbody>
    </table>

    <nav th:if="${totalPages > 1}">
        <ul class="pagination">
            <li class="page-item" th:classappend="${result.page == 0} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/browse(providerId=${providerId},serviceId=${serviceId},date=${date},page=${result.page - 1},size=${result.size})}">Previous</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link">Page <span th:text="${result.page + 1}">1</span> of <span th:text="${totalPages}">1</span></span>
            </li>
            <li class="page-item" th:classappend="${result.page + 1 >= totalPages} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/browse(providerId=${providerId},serviceId=${serviceId},date=${date},page=${result.page + 1},size=${result.size})}">Next</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
