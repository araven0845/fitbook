<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Booking Confirmed - FitBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container" style="max-width: 560px;">
    <div class="alert alert-success">Your appointment is booked.</div>
    <div class="card">
        <div class="card-body">
            <h1 class="h3 card-title">Appointment #<span th:text="${appointment.id}">1</span></h1>
            <p class="card-text">Trainer: <strong th:text="${appointment.providerName}">Trainer</strong></p>
            <p class="card-text">Service: <strong th:text="${appointment.serviceName}">Service</strong></p>
            <p class="card-text">When: <strong th:text="${appointment.startTime}">start</strong> &ndash;
                <span th:text="${#strings.substring(appointment.endTime, 11)}">end</span></p>
            <p class="card-text">Status: <span class="badge text-bg-success" th:text="${appointment.status}">BOOKED</span></p>
        </div>
    </div>
    <a class="btn btn-primary mt-3" th:href="@{/my-appointments}">My appointments</a>
    <a class="btn btn-link mt-3" th:href="@{/browse}">Book another</a>
</div>
</body>
</html>
