<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book an Appointment - FitBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container" style="max-width: 560px;">
    <h1 class="h3 mb-3">Book an appointment</h1>
    <div class="card mb-3">
        <div class="card-body">
            <h5 class="card-title" th:text="${slot.serviceName}">Service</h5>
            <p class="card-text mb-1">with <strong th:text="${slot.providerName}">Trainer</strong></p>
            <p class="card-text text-muted">
                <span th:text="${slot.startTime}">2026-01-01 09:00</span> &ndash;
                <span th:text="${#strings.substring(slot.endTime, 11)}">10:00</span>
            </p>
        </div>
    </div>
    <form method="post" th:action="@{/book}">
        <input type="hidden" name="slotId" th:value="${slot.id}">
        <input type="hidden" name="serviceId" th:value="${slot.serviceId}">
        <button class="btn btn-primary" type="submit">Confirm booking</button>
        <a class="btn btn-link" th:href="@{/browse}">Back to slots</a>
    </form>
</div>
</body>
</html>
