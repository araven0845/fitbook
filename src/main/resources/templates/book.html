<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book an Appointment - FitBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container"><span class="navbar-brand mb-0 h1">FitBook</span></div>
</nav>
<div class="container">
    <div class="alert alert-secondary">
        Wireframe stub - the booking form/POST endpoint and concurrency-safe
        booking logic are not implemented yet.
    </div>
    <h1 class="mb-3">Book an Appointment</h1>
    <form>
        <div class="mb-3">
            <label class="form-label">Trainer</label>
            <select class="form-select" disabled><option>Select a trainer...</option></select>
        </div>
        <div class="mb-3">
            <label class="form-label">Service</label>
            <select class="form-select" disabled><option>Select a service...</option></select>
        </div>
        <div class="mb-3">
            <label class="form-label">Available slot</label>
            <select class="form-select" disabled><option>Select a time slot...</option></select>
        </div>
        <button class="btn btn-primary" disabled>Confirm Booking</button>
    </form>
    <a class="btn btn-link" href="/">&larr; Back home</a>
</div>
</body>
</html>
