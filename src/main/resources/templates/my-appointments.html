<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My appointments - FitBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container">
    <h1 class="h3 mb-3">My appointments</h1>
    <div class="alert alert-success" th:if="${message}" th:text="${message}">Done</div>

    <h2 class="h5 mt-4">Upcoming</h2>
    <div class="text-muted" th:if="${appointments.upcoming.empty}">Nothing booked yet. <a th:href="@{/browse}">Browse slots</a>.</div>
    <table class="table table-striped align-middle" th:unless="${appointments.upcoming.empty}">
        <thead><tr><th>When</th><th>Service</th><th>Trainer</th><th>Status</th><th></th></tr></thead>
        <tbody>
        <tr th:each="a : ${appointments.upcoming}">
            <td><span th:text="${a.startTime}">start</span> &ndash; <span th:text="${#strings.substring(a.endTime, 11)}">end</span></td>
            <td th:text="${a.serviceName}">Service</td>
            <td th:text="${a.providerName}">Trainer</td>
            <td><span class="badge text-bg-success" th:text="${a.status}">BOOKED</span></td>
            <td class="text-end">
                <form method="post" th:action="@{/appointments/{id}/cancel(id=${a.id})}"
                      onsubmit="return confirm('Cancel this appointment?');">
                    <button class="btn btn-sm btn-outline-danger" type="submit">Cancel</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <h2 class="h5 mt-4">History</h2>
    <div class="text-muted" th:if="${appointments.history.empty}">No past or cancelled appointments.</div>
    <table class="table table-sm align-middle" th:unless="${appointments.history.empty}">
        <thead><tr><th>When</th><th>Service</th><th>Trainer</th><th>Status</th></tr></thead>
        <tbody>
        <tr th:each="a : ${appointments.history}">
            <td><span th:text="${a.startTime}">start</span> &ndash; <span th:text="${#strings.substring(a.endTime, 11)}">end</span></td>
            <td th:text="${a.serviceName}">Service</td>
            <td th:text="${a.providerName}">Trainer</td>
            <td><span class="badge"
                      th:classappend="${a.status == 'COMPLETED'} ? 'text-bg-secondary' : 'text-bg-warning'"
                      th:text="${a.status}">COMPLETED</span></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
