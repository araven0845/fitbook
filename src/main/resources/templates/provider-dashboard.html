<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My slots - FitBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container">
    <h1 class="h3 mb-3">My availability</h1>
    <div class="alert alert-success" th:if="${message}" th:text="${message}">Done</div>

    <div class="card mb-4">
        <div class="card-body">
            <h2 class="h5">Create a slot</h2>
            <form class="row g-2" method="post" th:action="@{/provider/slots}">
                <div class="col-md-5">
                    <select class="form-select" name="serviceId" required>
                        <option th:each="s : ${services}" th:value="${s.id}"
                                th:text="${s.name + ' (' + s.durationMinutes + ' min)'}">Service</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <input class="form-control" type="datetime-local" name="startTime" required>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-primary" type="submit">Create slot</button>
                </div>
            </form>
            <div class="form-text">The end time is the start time plus the service duration.</div>
        </div>
    </div>

    <div class="text-muted" th:if="${slots.empty}">You have no upcoming slots.</div>
    <table class="table table-striped align-middle" th:unless="${slots.empty}">
        <thead><tr><th>When</th><th>Service</th><th>Status</th><th></th></tr></thead>
        <tbody>
        <tr th:each="s : ${slots}">
            <td><span th:text="${s.startTime}">start</span> &ndash; <span th:text="${#strings.substring(s.endTime, 11)}">end</span></td>
            <td th:text="${s.serviceName}">Service</td>
            <td><span class="badge" th:classappend="${s.status == 'OPEN'} ? 'text-bg-success' : 'text-bg-primary'" th:text="${s.status}">OPEN</span></td>
            <td class="text-end">
                <form th:if="${s.status == 'OPEN'}" method="post" th:action="@{/provider/slots/{id}/remove(id=${s.id})}"
                      onsubmit="return confirm('Remove this slot?');">
                    <button class="btn btn-sm btn-outline-danger" type="submit">Remove</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
