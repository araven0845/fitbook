<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="_wireframe.css"></head>
<body>
<div class="frame">
    <div class="titlebar"><span>FitBook</span><span>Book Appointment</span></div>
    <div class="nav"><span>Home</span><span>Browse Slots</span><span>[ Book ]</span><span>Log in</span></div>
    <div class="content">
        <div class="annotation">WIREFRAME &mdash; Screen 3 of 4: Book appointment (form)</div>
        <div class="box">
            <div class="box-title">Selected Slot</div>
            <div class="row"><span>Maya Chen &mdash; 1:1 Personal Training</span><span>Wed 9:00&ndash;10:00am</span></div>
        </div>
        <div class="box">
            <div class="box-title">Your Details</div>
            <div class="grid-2">
                <div><div class="field-label">Full name</div><div class="field">Jane Doe</div></div>
                <div><div class="field-label">Email</div><div class="field">jane@example.com</div></div>
            </div>
            <div class="field-label">Notes (optional)</div>
            <div class="field" style="height:50px;"></div>
        </div>
        <span class="btn primary">Confirm Booking</span>
        <span class="btn" style="margin-left:8px;">Cancel</span>
    </div>
</div>
</body></html>
